<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Egoist Lagom — предложение дизайна, сетевые действия отключены</title><link rel="stylesheet" href="tokens-proposal.css"><link rel="stylesheet" href="preview.css"></head>
<body>
<div class="proposal-note"><strong>Предложение дизайна</strong><span>Макет. Состояния служб не проверяются, сетевые действия не выполняются. Кандидат 3.8.0 не изменён.</span><a href="../design-audit.md">Аудит и критерии</a></div>
<div class="shell">
  <header class="titlebar"><div class="wordmark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 4v6c0 6-4 10-9 12C7 22 3 18 3 12V6l9-4Z"/><path d="m12 5 4 8-4 8-4-8 4-8Z"/></svg><strong>EGOIST <span>LAGOM</span></strong></div><span class="mode-label">Макет полного окна</span><button class="button quiet compact" data-screen="mini">Мини-щит</button><button class="icon-button" aria-label="Сценарий закрытого приложения" data-screen="closed">×</button></header>
  <aside class="sidebar"><nav aria-label="Экраны предложения"><button data-screen="overview" aria-current="page"><svg class="icon nav-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg><span>Обзор</span></button><button data-screen="connection"><svg class="icon nav-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span>Соединение</span></button><button data-screen="dns"><svg class="icon nav-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="6" rx="1.5"/><rect x="2" y="16" width="7" height="6" rx="1.5"/><rect x="15" y="16" width="7" height="6" rx="1.5"/><path d="M12 8v4M5.5 16v-4h13v4"/></svg><span>DNS</span></button><button data-screen="profiles"><svg class="icon nav-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 4v6c0 6-4 10-9 12C7 22 3 18 3 12V6l9-4Z"/><path d="M7 13h10m-4-4 4 4-4 4"/></svg><span>Профили DPI</span></button><button data-screen="telegram"><svg class="icon nav-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 11 22 3l-4 18-6-6-5 4v-7L22 3M7 12l5 3"/></svg><span>Telegram</span></button><button data-screen="settings"><svg class="icon nav-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><rect x="7" y="4" width="4" height="4" rx="1" fill="var(--sidebar)"/><rect x="14" y="10" width="4" height="4" rx="1" fill="var(--sidebar)"/><rect x="6" y="16" width="4" height="4" rx="1" fill="var(--sidebar)"/></svg><span>Настройки</span></button></nav><footer><p>Сетевой контроль Windows</p><button data-screen="states">Состояния и движение</button></footer></aside>
  <main id="stage" tabindex="-1"></main>
</div>
<div id="preview-feedback" role="status" aria-live="polite"></div>
<template id="overview"><header class="page-heading"><div><p class="eyebrow">СЕТЕВОЙ КОНТРОЛЬ</p><h1>Обзор</h1><p>Одно действие. Раздельное состояние компонентов.</p></div><span class="badge">Не проверено</span></header>
<section class="panel connection-card"><div class="connection-copy"><div class="mark"><svg viewBox="0 0 64 72" aria-hidden="true"><path d="m32 4 25 10v18c0 16-10 26-25 33C17 58 7 48 7 32V14L32 4Z"/><path d="M32 21v13M22 25a15 15 0 1 0 20 0"/></svg></div><div><h2>Подключение щита</h2><p>Профиль DPI и выбранные дополнительные компоненты.<br>VPN-маршрут подключается отдельно.</p><button class="button primary" data-demo="Подключение щита">Подключить щит</button></div></div><dl class="meta"><div><dt>Профиль DPI</dt><dd>Выберите профиль</dd></div><div><dt>DNS вместе со щитом</dt><dd>Выбор пользователя</dd></div><div><dt>Telegram вместе со щитом</dt><dd>Выбор пользователя</dd></div><div><dt>Результат проверки</dt><dd>Не проверено</dd></div></dl></section>
<section class="panel"><header class="section-heading"><h2>Компоненты</h2><span class="caption">Готовность и автозапуск — отдельные факты</span></header><div class="component-row"><div><h3>DNS</h3><p>Разрешение имён и шифрование DNS</p></div><span class="state unknown">Не проверено</span><button class="button secondary" data-screen="dns">Настроить</button></div><div class="component-row"><div><h3>Профили DPI</h3><p>Обработка выбранных доменов и IP</p></div><span class="state unknown">Не проверено</span><button class="button secondary" data-screen="profiles">Настроить</button></div><div class="component-row"><div><h3>Telegram Proxy</h3><p>Служба и добавление прокси в Telegram</p></div><span class="state unknown">Не проверено</span><button class="button secondary" data-screen="telegram">Настроить</button></div><div class="component-row"><div><h3>VPN-маршрут</h3><p>Отдельное соединение с выбранным сервером</p></div><span class="state unknown">Не проверено</span><button class="button secondary" data-screen="connection">Открыть</button></div></section>
<section class="panel split"><div><h2>Проверка сети</h2><p>DNS, маршрут и доступность целей. Последняя проверка пока отсутствует.</p></div><button class="button secondary" data-demo="Проверка сети">Проверить сеть</button></section><details class="panel"><summary>Подробности и восстановление</summary><p>Сначала указать компонент, причину и последнее наблюдение. Восстановление не должно сбрасывать чужие настройки.</p><button class="button secondary" data-demo="Восстановление">Восстановить настройки Lagom</button></details></template>
<template id="connection"><header class="page-heading"><div><h1>Соединение</h1><p>Выберите сервер и подключите VPN-маршрут.</p></div><span class="badge">Не проверено</span></header><div class="columns"><section class="panel"><header class="section-heading"><h2>Серверы</h2><button class="button primary compact" data-demo="Импорт подписки">Импортировать</button></header><label class="field">Поиск серверов<input placeholder="Название, страна или протокол" type="search"></label><div class="empty"><h3>Серверы ещё не добавлены</h3><p>Импортируйте ссылку подписки или файл конфигурации.<br>Доступность появится после отдельной проверки.</p></div><details><summary>Выбор и проверка серверов</summary><p>Выбор строки не подключает маршрут. У выбранного сервера появляется одно основное действие. Измерение задержки имеет время и метод.</p></details></section><div class="stack"><section class="panel"><h2>Маршрут</h2><dl class="meta"><div><dt>Выбранный сервер</dt><dd>Не выбран</dd></div><div><dt>Состояние процесса</dt><dd>Не проверено</dd></div><div><dt>Выход через сервер</dt><dd>Не проверено</dd></div><div><dt>Работа без приложения</dt><dd>Требуется приложение</dd></div></dl><button class="button secondary" data-demo="Проверка маршрута">Проверить маршрут</button></section><section class="panel"><h2>Подписка</h2><p>Данные появятся после импорта. Секретный адрес скрыт.</p><button class="button secondary" data-demo="Обновление подписки">Обновить подписку</button><details class="maintenance"><summary>Удаление подписки</summary><p>Указать количество удаляемых узлов. При активном маршруте объяснить, что произойдёт с соединением.</p><button class="button danger" data-demo="Удаление подписки">Удалить подписку</button></details></section></div></div></template>
<template id="dns"><header class="page-heading"><div><h1>DNS</h1><p>Настройте разрешение имён и проверьте фактическую работу.</p></div><span class="badge">Не проверено</span></header><div class="columns"><section class="panel"><h2>Конфигурация DNS</h2><fieldset class="mode-picker"><legend>Режим</legend><label><input type="radio" name="dns-mode" checked> Зашифрованный DNS</label><label><input type="radio" name="dns-mode"> Обычный DNS</label></fieldset><label class="field">Адрес DoH или поддерживаемое имя DoT<input class="mono" placeholder="HTTPS-адрес DNS-провайдера" spellcheck="false"></label><p class="caption">Изменение будет применено к поддерживаемым адаптерам. Перед применением перечислить затронутые адаптеры.</p><div class="action-row"><button class="button primary" data-demo="Применение DNS">Применить DNS</button><button class="button secondary" data-demo="Проверка адреса DNS">Проверить адрес</button></div><details class="maintenance"><summary>Восстановить исходный DNS</summary><p>Показать собственную сохранённую конфигурацию, которую можно вернуть. Чужие изменения не перезаписываются.</p><button class="button danger" data-demo="Восстановление DNS">Восстановить исходный DNS</button></details></section><div class="stack"><section class="panel"><h2>Текущий DNS</h2><dl class="meta"><div><dt>Применённый адрес</dt><dd>Не прочитан</dd></div><div><dt>Шифрование</dt><dd>Не проверено</dd></div><div><dt>Локальная готовность</dt><dd>Не проверено</dd></div><div><dt>Автозапуск</dt><dd>Не проверено</dd></div><div><dt>Без приложения</dt><dd>Не проверено</dd></div></dl></section><section class="panel"><h2>Проверка DNS</h2><p>Сначала измерить разрешение имени и соединение с целью раздельно. Общий успех не означает доступность всех сайтов.</p><dl class="meta"><div><dt>Ответ DNS</dt><dd>Не измерен</dd></div><div><dt>Соединение с целью</dt><dd>Не измерено</dd></div><div><dt>Последняя проверка</dt><dd>Не проводилась</dd></div></dl><button class="button secondary" data-demo="Диагностика DNS">Проверить DNS</button></section></div></div></template>
<template id="profiles"><header class="page-heading"><div><h1>Профили DPI</h1><p>Выбор обработки трафика, проверка целей и собственная служба.</p></div><span class="badge">Не проверено</span></header><div class="columns"><section class="panel"><h2>Профиль</h2><label class="field">Активный профиль<select><option>Выберите профиль</option></select></label><p>Подбор временно проверяет доступность целей. Покажите цену операции и возможность отменить её.</p><button class="button primary" data-demo="Подключение профиля DPI">Подключить профиль</button><button class="button secondary" data-demo="Подбор профиля">Подобрать профиль</button><details><summary>Служба и обслуживание</summary><p>Установка, автозапуск и текущая готовность проверяются отдельно. Удаление и сброс доступны с описанием последствий.</p><button class="button secondary" data-demo="Установка службы DPI">Установить службу</button></details></section><div class="stack"><section class="panel"><h2>Состояние</h2><dl class="meta"><div><dt>Применённый профиль</dt><dd>Не прочитан</dd></div><div><dt>Служба</dt><dd>Не проверено</dd></div><div><dt>Цели проверки</dt><dd>Не проверено</dd></div><div><dt>Без приложения</dt><dd>Не проверено</dd></div></dl></section><section class="panel"><h2>История и правила</h2><div class="local-tabs" role="tablist" aria-label="Профили DPI"><button role="tab" id="history-tab" aria-controls="history-panel" aria-selected="true" tabindex="0">История</button><button role="tab" id="rules-tab" aria-controls="rules-panel" aria-selected="false" tabindex="-1">Правила</button></div><div role="tabpanel" id="history-panel" aria-labelledby="history-tab" tabindex="0"><p>Проверок пока нет. Сохраняйте время, выбранный профиль, все цели и неполный результат.</p></div><div role="tabpanel" id="rules-panel" aria-labelledby="rules-tab" tabindex="0" hidden><label class="field">Домены и IP / CIDR<textarea class="mono" placeholder="По одному правилу на строку"></textarea></label><p>Перед применением показывать только реальную ошибку формата; адреса не исправлять скрыто.</p><button class="button secondary" data-demo="Применение правил">Сохранить и применить</button></div></section></div></div></template>
<template id="telegram"><header class="page-heading"><div><h1>Telegram</h1><p>Сначала подготовьте прокси. Затем добавьте его в Telegram.</p></div><span class="badge">Не проверено</span></header><div class="columns"><section class="panel"><h2>Локальный прокси</h2><ol class="steps"><li><strong>Установить службу</strong><p>Проверить файлы, права и режим запуска.</p><button class="button primary" data-demo="Установка Telegram Proxy">Установить службу</button></li><li><strong>Проверить готовность</strong><p>Работа процесса и слушателя — локальная проверка. Доставка сообщения проверяется отдельно.</p><button class="button secondary" data-demo="Проверка Telegram Proxy">Проверить прокси</button></li><li><strong>Добавить в Telegram</strong><p>Открытие ссылки не подтверждает принятие настройки приложением Telegram.</p><button class="button secondary" data-demo="Открытие ссылки Telegram">Открыть настройку Telegram</button></li></ol><details><summary>Адреса и дополнительные параметры</summary><label class="field">Слушатель<input class="mono" placeholder="Адрес и порт"></label><label class="field">DC и транспорт<textarea class="mono" placeholder="Существующие настройки"></textarea></label></details></section><div class="stack"><section class="panel"><h2>Состояние прокси</h2><dl class="meta"><div><dt>Установка службы</dt><dd>Не проверено</dd></div><div><dt>Автозапуск</dt><dd>Не проверено</dd></div><div><dt>Локальный слушатель</dt><dd>Не проверено</dd></div><div><dt>Внешний маршрут</dt><dd>Не проверено</dd></div><div><dt>Telegram принял настройку</dt><dd>Нет данных</dd></div></dl></section><section class="panel"><header class="section-heading"><h2>События</h2><button class="button secondary compact" data-demo="Открытие журнала">Открыть журнал</button></header><p>Журнал не загружен. Здесь показываются реальные события с временем и полным доступным сообщением.</p><details class="maintenance"><summary>Остановить или удалить службу</summary><p>Остановка изменяет желаемое состояние. Supervisor не должен снова запускать службу без команды пользователя.</p><button class="button danger" data-demo="Удаление Telegram Proxy">Удалить службу</button></details></section></div></div></template>
<template id="settings"><header class="page-heading"><div><h1>Настройки</h1><p>Поведение приложения, обновления и диагностика.</p></div></header><div class="columns"><section class="panel"><h2>Приложение и окно</h2><label class="preference"><span><strong>Запускать при входе в Windows</strong><small>Нужен для VPN-маршрута. Системные службы имеют свой автозапуск.</small></span><input type="checkbox"></label><label class="preference"><span><strong>Закрывать в трей</strong><small>Крестик скрывает окно. Команда «Выйти» завершает приложение.</small></span><input type="checkbox"></label><h2>Поведение VPN-маршрута</h2><label class="preference"><span><strong>Автоподключение</strong><small>Восстановить последний выбранный сервер после входа.</small></span><input type="checkbox"></label><label class="preference"><span><strong>Восстановление при обрыве</strong><small>Приложение повторит попытку с ограничением частоты.</small></span><input type="checkbox"></label><h2>Уведомления и приватность</h2><label class="preference"><span><strong>Сообщать о важных изменениях</strong><small>Ошибка, восстановление и требуемое действие.</small></span><input type="checkbox"></label><label class="preference"><span><strong>Передавать HWID провайдеру подписки</strong><small>Идентификатор устройства отправляется с запросом подписки.</small></span><input type="checkbox"></label></section><div class="stack"><section class="panel"><h2>Обновления</h2><label class="preference"><span><strong>Автоматически устанавливать доверенные обновления</strong><small>Только пока приложение работает, включая трей.</small></span><input type="checkbox"></label><p>Версия, доступный релиз и последний результат проверки должны приходить от backend. Сейчас данных нет.</p><button class="button primary" data-demo="Проверка обновлений">Проверить обновление</button><p class="caption">Перед установкой указать версию, результат проверки подписи и затронутые компоненты.</p></section><section class="panel"><h2>Диагностика</h2><p>Локальные журналы и состояние компонентов. Перед экспортом скрыть секреты и показать путь архива.</p><div class="action-row"><button class="button secondary" data-demo="Экспорт диагностики">Экспортировать</button><button class="button secondary" data-demo="Открытие журналов">Открыть журналы</button></div></section><section class="panel"><h2>Системный доступ</h2><dl class="meta"><div><dt>Core</dt><dd>Не проверено</dd></div><div><dt>Права приложения</dt><dd>Не проверено</dd></div><div><dt>TUN</dt><dd>Требует проверки прав</dd></div></dl></section></div></div></template>
<template id="mini"><header class="page-heading"><div><h1>Мини-щит</h1><p>Состояние и выбор подключения видны отдельно.</p></div></header><section class="mini-preview panel"><header class="mini-head"><strong>egoist / lagom</strong><button class="icon-button" data-screen="overview" aria-label="Открыть полный обзор" title="Открыть полный обзор">↗</button></header><div class="mini-status"><button class="mini-power" aria-label="Проверить состояние щита" title="Состояние неизвестно. Сначала выполнить проверку." data-demo="Проверка состояния мини-щита"><svg viewBox="0 0 64 72" aria-hidden="true"><path d="m32 4 25 10v18c0 16-10 26-25 33C17 58 7 48 7 32V14L32 4Z"/><path d="M32 21v13M22 25a15 15 0 1 0 20 0"/></svg></button><h2>Состояние не проверено</h2><p>Нажмите на щит для проверки</p><p class="caption">Профиль DPI · DNS · Telegram</p></div><fieldset class="mini-intent"><legend>Включить вместе со щитом</legend><label><input type="checkbox"><span>DNS</span><small>Не проверено</small></label><label><input type="checkbox"><span>Telegram</span><small>Не проверено</small></label></fieldset></section><p class="caption">Выбор флажка меняет намерение. Готовность отображается отдельно. Непроверенный статус допускает только проверку; после неё доступно подключение.</p></template>
<template id="closed"><header class="page-heading"><div><h1>Приложение закрыто</h1><p>Это описание сценария. Реальное приложение не закрывалось.</p></div></header><section class="panel"><h2>Что должно продолжить работу</h2><ul class="plain-list"><li>Core и установленные фоновые компоненты — по сохранённому намерению пользователя.</li><li>DNS — по фактическому выбранному режиму Windows или отдельной службе.</li><li>Прокси Telegram и DPI — если установлены и включены как службы.</li><li>VPN-маршрут и проверка обновлений — в текущей архитектуре требуют приложения.</li></ul><p>Трей и закрытое приложение различаются. UI должен показывать эту границу до закрытия, не обещая общий режим «всё работает без приложения».</p><button class="button secondary" data-screen="overview">Вернуться к макету</button></section></template>
<template id="states"><header class="page-heading"><div><h1>Состояния и движение</h1><p>Спецификация, не имитация состояния служб.</p></div></header><section class="panel"><img class="icon-sheet" src="icons-proposal.svg" alt="Образцы оригинальных иконок: бренд, действие, неизвестно, готово, проверка, ошибка"><h2>Сначала факт, затем стиль</h2><dl class="meta"><div><dt>Неизвестно</dt><dd>Нет достоверного наблюдения; доступна проверка</dd></div><div><dt>Выполняется</dt><dd>Реальная фаза; повторное действие блокируется</dd></div><div><dt>Готово</dt><dd>Выполнены условия готовности конкретного компонента</dd></div><div><dt>Не готово</dt><dd>Процесс есть, но нужная проверка не прошла</dd></div><div><dt>Ошибка</dt><dd>Причина, область, время, доступное восстановление</dd></div><div><dt>Выключено</dt><dd>Подтверждённое выключение; не отсутствие данных</dd></div></dl><h2>Прерывание анимаций</h2><p>Hover не меняет состояние компонента. Новое действие заменяет переход, старый callback не устанавливает успех. Reduced motion убирает декоративное движение. Фокус возвращается инициатору закрытого диалога.</p></section></template>
