<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" role="img" aria-labelledby="title desc">
  <title id="title">Egoist Lagom — схема редизайна</title><desc id="desc">Полное окно, компактный режим и граница закрытого приложения. Статический проектный чертёж, данные служб не отображаются.</desc>
  <rect width="1240" height="780" fill="#090909"/>
  <g fill="#f5f5f5" font-family="Segoe UI,sans-serif"><text x="32" y="43" font-size="24" font-weight="650">Egoist Lagom / чёрно-белый интерфейс</text><text x="32" y="72" font-size="14" fill="#b8b8b8">Предложение. Названия зон и контрактов; это не живое состояние сети.</text></g>
  <g fill="#121212" stroke="#333333"><rect x="32" y="104" width="786" height="624" rx="12"/><rect x="842" y="104" width="366" height="450" rx="12"/><rect x="842" y="578" width="366" height="150" rx="12"/></g>
  <g fill="#0e0e0e" stroke="#333333"><path d="M44 104h762q12 0 12 12v32H32v-32q0-12 12-12Z"/><path d="M32 148h146v580H44q-12 0-12-12Z"/></g>
  <g fill="#f5f5f5" font-family="Segoe UI,sans-serif" font-size="14"><text x="50" y="132" font-weight="650">EGOIST LAGOM</text><text x="620" y="132" fill="#b8b8b8">Полное окно / мини-щит</text><text x="55" y="186">Обзор</text><text x="55" y="228" fill="#b8b8b8">Соединение</text><text x="55" y="270" fill="#b8b8b8">DNS</text><text x="55" y="312" fill="#b8b8b8">Профили DPI</text><text x="55" y="354" fill="#b8b8b8">Telegram</text><text x="55" y="396" fill="#b8b8b8">Настройки</text><text x="202" y="186" font-size="22" font-weight="650">Обзор</text><text x="202" y="213" fill="#b8b8b8">Намерение → применённая конфигурация → проверенная готовность</text></g>
  <g fill="#1b1b1b" stroke="#333333"><rect x="202" y="235" width="590" height="136" rx="10"/><rect x="202" y="389" width="590" height="234" rx="10"/><rect x="202" y="641" width="590" height="60" rx="10"/></g>
  <g fill="#f5f5f5" font-family="Segoe UI,sans-serif" font-size="14"><text x="222" y="263" font-weight="650">Подключение щита</text><text x="222" y="289" fill="#b8b8b8">Профиль DPI + выбранные DNS / Telegram</text><text x="222" y="340" font-weight="650">Одно основное действие</text><text x="547" y="267" fill="#b8b8b8">Область подключения</text><text x="547" y="294" fill="#b8b8b8">Последняя проверка</text><text x="547" y="321" fill="#b8b8b8">VPN подключается отдельно</text><text x="222" y="418" font-weight="650">Компоненты</text><text x="222" y="459">DNS</text><text x="222" y="507">DPI</text><text x="222" y="555">Telegram</text><text x="222" y="603">VPN</text><text x="403" y="459" fill="#b8b8b8">Подтверждённое состояние</text><text x="403" y="507" fill="#b8b8b8">Подтверждённое состояние</text><text x="403" y="555" fill="#b8b8b8">Подтверждённое состояние</text><text x="403" y="603" fill="#b8b8b8">Подтверждённое состояние</text><text x="709" y="459">Открыть</text><text x="709" y="507">Открыть</text><text x="709" y="555">Открыть</text><text x="709" y="603">Открыть</text><text x="222" y="676">Проверка сети / подробности / восстановление по причине</text></g>
  <g stroke="#333333"><path d="M222 473h550M222 521h550M222 569h550"/></g>
  <g fill="#f5f5f5" font-family="Segoe UI,sans-serif" font-size="14"><text x="866" y="139" font-size="20" font-weight="650">Мини-щит</text><text x="866" y="166" fill="#b8b8b8">Быстрое действие и честный статус</text><text x="866" y="360" font-weight="650">Факт: состояние не проверено</text><text x="866" y="400">Действие: проверить / подключить</text><text x="866" y="440">Выбор: включить вместе со щитом</text><text x="883" y="471" fill="#b8b8b8">□ DNS</text><text x="1025" y="471" fill="#b8b8b8">□ Telegram</text><text x="866" y="516">Состояние DNS и Telegram отдельно</text><text x="866" y="609" font-size="18" font-weight="650">Когда приложение закрыто</text><text x="866" y="639" fill="#b8b8b8">Службы: собственный автозапуск</text><text x="866" y="665" fill="#b8b8b8">VPN / updater: требуется приложение</text><text x="866" y="695" fill="#b8b8b8">Трей и полный выход различаются</text></g>
