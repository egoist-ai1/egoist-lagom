name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build generated bundles
        run: npm run build
      - name: Install NSIS for installer regressions
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Run tests
        env:
          SHIELD_MAKENSIS: C:\\Program Files (x86)\\NSIS\\makensis.exe
        run: npm test
